name: ${PROJECT}

services:
  web:
    image: caddy:alpine
    volumes:
      - ./apps/web:/usr/share/caddy:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT}_web.rule=Host(`web.${PROJECT}.localhost`)"
      - "traefik.http.services.${PROJECT}_web.loadbalancer.server.port=80"
    networks:
      - traefik
  
networks:
  traefik:
    external: true